[package]
name = "radix-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Radix calculator GUI (GTK4/libadwaita; clean-room implementation of the documented GNOME Calculator behavior)"

[dependencies]
radix-core = { path = "../radix-core" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4", "v1_5"] }

[[bin]]
name = "radix"
path = "src/main.rs"

[[bin]]
name = "radix-search-provider"
path = "src/bin/radix-search-provider.rs"
